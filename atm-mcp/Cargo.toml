[package]
name = "atm-mcp"
version = "0.1.0"
description = "ATM read-only stdio MCP prototype (S1): embedded public catalog, no database, no network"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"
publish = false

# Standalone package: NOT a member of any workspace and independent of src-tauri.
[workspace]

[dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt", "io-std", "io-util", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-normalization = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
