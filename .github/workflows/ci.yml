name: CI

# Evidence policy: a green job here proves what its steps actually did on that runner and nothing more.
# In particular, macOS compiling and running the headless --self-check is NOT a macOS GUI test.
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ai-toolchain-manager.exe
          - name: macos-arm64
            os: macos-15 # Apple Silicon (arm64) runner
            target: aarch64-apple-darwin
            exe: ai-toolchain-manager
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Verify immutable GitHub Actions pins
        run: python tools/check_action_pins.py

      - name: Rust toolchain (stable, ${{ matrix.target }})
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
          rustup default stable
          rustc -vV
          cargo -V

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ matrix.name }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.name }}-

      - name: Confirm runner architecture
        run: |
          echo "runner: $RUNNER_OS / $RUNNER_ARCH"
          if [ "${{ matrix.name }}" = "macos-arm64" ]; then test "$(uname -m)" = "arm64"; fi

      - name: Phase 0 contract tests (Python)
        run: |
          python -m pip install -r requirements-test.txt
          python -m unittest discover -s tests -v

      - name: Frontend install, typecheck, test, build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Rust format, lint and unit tests
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings
          cargo test --target ${{ matrix.target }}

      # CONFIG-02C (Issue #40): machine-visible evidence per case and per operating system. Every Rust and vitest case prints one
      # `CONFIG02C_RESULT|<id>|<os>|<status>|<reason>` line; tools/config02c_results_check.py fails this step when an id has no line (NOT RUN),
      # has FAIL/BLOCKED, or is SKIPPED for a reason the manifest does not allow. A skipped case is listed as SKIPPED and is never counted as a pass.
      # Fixtures are made by the tests under the runner's temporary directory; no real project file is read.
      - name: CONFIG-02C evidence (result lines per case; the gate fails on a missing id)
        run: |
          OUT="${{ runner.temp }}/config02c-${{ matrix.name }}"
          mkdir -p "$OUT"
          OSNAME=windows
          if [ "${{ matrix.name }}" = "macos-arm64" ]; then OSNAME=macos; fi
          RC=0
          (cd src-tauri && CONFIG02C_RESULTS="$OUT/rust-results.txt" cargo test --target ${{ matrix.target }} config02c -- --nocapture --test-threads=1) 2>&1 | tee "$OUT/rust.log" || RC=1
          npx vitest run src/FileSnapshot.test.tsx --reporter=verbose 2>&1 | tee "$OUT/vitest.log" || RC=1
          python tools/config02c_results_check.py --os "$OSNAME" --manifest tests/config02c_expected_results.json --results "$OUT/rust-results.txt" "$OUT/vitest.log" --summary "$OUT/summary.txt" || RC=1
          exit $RC

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: config02c-results-${{ matrix.name }}
          path: ${{ runner.temp }}/config02c-${{ matrix.name }}
          if-no-files-found: error

      # Phase 3D-2: the SYNTHETIC pilot supply (made-up tools and bytes, acting adapter constructor) is compiled only with this non-default
      # feature. This step lints and tests that configuration; the release build below never enables it.
      - name: Synthetic-pilot feature configuration (lint and tests; never part of the release build)
        working-directory: src-tauri
        run: |
          cargo clippy --target ${{ matrix.target }} --all-targets --features synthetic-pilot -- -D warnings
          cargo test --target ${{ matrix.target }} --features synthetic-pilot

      # Phase 3D-4 (B2): the jq pilot configuration. The feature is Windows-only (a compile error elsewhere), off by default and never part of the
      # release build below. Even where it compiles, the real jq bytes stay locked; the tests use synthetic bytes only. CI-generated, SUPPORTING evidence.
      - name: jq-pilot feature configuration (Windows only; lint and tests; never part of the release build)
        if: matrix.name == 'windows-x64'
        working-directory: src-tauri
        run: |
          cargo clippy --target ${{ matrix.target }} --all-targets --features jq-pilot -- -D warnings
          cargo test --target ${{ matrix.target }} --features jq-pilot

      - name: jq-pilot feature is refused on macOS at compile time (the default build there stays unable to install jq)
        if: matrix.name == 'macos-arm64'
        working-directory: src-tauri
        run: |
          if cargo check --target ${{ matrix.target }} --features jq-pilot > "${{ runner.temp }}/jq-pilot-macos.txt" 2>&1; then
            echo "the jq-pilot feature compiled on macOS: it must not"; exit 1
          fi
          grep -q "Windows-only" "${{ runner.temp }}/jq-pilot-macos.txt"
          echo "refused as intended:"; grep -m1 "Windows-only" "${{ runner.temp }}/jq-pilot-macos.txt"

      - name: B2 staging reproduction (synthetic bytes; supporting evidence)
        run: python tools/run_staging.py --manifest docs/phase-3d4/b2-staging-manifest.json --skip-frontend --report "${{ runner.temp }}/b2-staging-report-${{ matrix.name }}.json"

      # Phase 3D-5 (Issue #24): the one-installation allowance, on synthetic bytes only. CI-generated, SUPPORTING evidence of this commit.
      - name: B3 one-installation staging reproduction (synthetic bytes; supporting evidence)
        run: python tools/run_staging.py --manifest docs/phase-3d5/b3-staging-manifest.json --skip-frontend --report "${{ runner.temp }}/b3-staging-report-${{ matrix.name }}.json"

      # Phase 3D-3B: runs EXACTLY the identifiers of docs/phase-3d3b/staging-manifest.json on the synthetic fixture. CI-generated, SUPPORTING evidence of
      # this commit only (exit status 0 = every named check passed); the developer-authored assertions do not become independent by running here.
      - name: Staging reproduction of the jq review package (synthetic fixture; supporting evidence)
        run: python tools/run_staging.py --skip-frontend --report "${{ runner.temp }}/staging-report-${{ matrix.name }}.json"

      - name: Build Tauri app (no bundle, no signing)
        run: npx tauri build --no-bundle --target ${{ matrix.target }}

      - name: Verify the built binary's architecture
        run: |
          BIN="src-tauri/target/${{ matrix.target }}/release/${{ matrix.exe }}"
          ls -l "$BIN"
          if [ "${{ matrix.name }}" = "macos-arm64" ]; then file "$BIN" | tee /dev/stderr | grep -q arm64; fi

      - name: Headless self-check of the built binary + cross-language audit contract
        env:
          ATM_DATA_DIR: ${{ runner.temp }}/atm-selfcheck-data
        run: |
          BIN="src-tauri/target/${{ matrix.target }}/release/${{ matrix.exe }}"
          OUT="${{ runner.temp }}/selfcheck-${{ matrix.name }}.json"
          "$BIN" --self-check "$OUT"
          head -c 1500 "$OUT"; echo   # no pipe: with pipefail, `cat | head` fails (SIGPIPE) once the file exceeds the pipe buffer
          ATM_SELFCHECK_JSON="$OUT" python -m unittest discover -s tests -v

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: selfcheck-${{ matrix.name }}
          path: ${{ runner.temp }}/selfcheck-${{ matrix.name }}.json
          if-no-files-found: warn

      # For real-device acceptance only (docs/phase-3d0/DEVICE-TEST-PLAN.md): the UNSIGNED, un-notarised binary of this exact SHA,
      # kept for 3 days, with its SHA-256. It is run only with --self-check and an isolated ATM_DATA_DIR. It is not a release.
      - name: Record the SHA-256 of the unsigned device-test binary
        run: |
          BIN="src-tauri/target/${{ matrix.target }}/release/${{ matrix.exe }}"
          mkdir -p "${{ runner.temp }}/device-test"
          cp "$BIN" "${{ runner.temp }}/device-test/${{ matrix.exe }}"
          (cd "${{ runner.temp }}/device-test" && (sha256sum "${{ matrix.exe }}" 2>/dev/null || shasum -a 256 "${{ matrix.exe }}") > SHA256.txt && echo "commit ${{ github.sha }}" >> SHA256.txt && cat SHA256.txt)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-test-unsigned-${{ matrix.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/device-test/
          retention-days: 3
          if-no-files-found: error

      # JQ-PILOT-NEXT-04: an EXPERIMENTAL, UNSIGNED, NON-RELEASE Windows debug executable with the non-default jq-pilot feature, for ONE future,
      # separately authorized manual test. It runs only for a push to development (never for a pull request, never on main), only on the Windows
      # job, and AFTER every step and artifact above, so the default release build (which never carries a pilot feature), its self-check and the
      # device-test artifact are exactly what they were. The debug profile writes to target/<triple>/debug, the release build to target/<triple>/release.
      # It is built from this exact commit; an older executable is never reused (a cached one is deleted first). Not independently accepted. Not a release.
      # CI compilation says nothing about Smart App Control acceptance on any other computer.
      - name: Build the experimental jq-pilot GUI executable (Windows only; unsigned; debug; never a release)
        if: matrix.name == 'windows-x64' && github.event_name == 'push' && github.ref == 'refs/heads/development'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          BIN="src-tauri/target/${{ matrix.target }}/debug/${{ matrix.exe }}"
          rm -f "$BIN"
          npx tauri build --debug --no-bundle --target ${{ matrix.target }} --features jq-pilot
          test -f "$BIN"
          python - "$BIN" <<'PY'
          import struct, sys
          d = open(sys.argv[1], "rb").read(4096)
          assert d[:2] == b"MZ", "not a PE file"
          off = struct.unpack_from("<I", d, 0x3C)[0]
          assert d[off:off + 4] == b"PE\0\0", "no PE signature"
          machine = struct.unpack_from("<H", d, off + 4)[0]
          assert machine == 0x8664, "not x64: 0x%04x" % machine
          print("PE x64 OK")
          PY
          OUT="${{ runner.temp }}/jq-pilot-unsigned"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$BIN" "$OUT/atm-jq-pilot-experimental.exe"
          cmp "$BIN" "$OUT/atm-jq-pilot-experimental.exe"
          {
            echo "EXPERIMENTAL / UNSIGNED / NOT A RELEASE / NOT INDEPENDENTLY ACCEPTED"
            echo "jq-pilot test build of commit ${{ github.sha }}. It does not contain the jq program."
            echo "It is armed for one data-directory scope identifier only; it installs nothing without the owner's separate authorization."
            echo "A successful CI build says nothing about Smart App Control acceptance on any computer."
          } > "$OUT/EXPERIMENTAL-NOT-A-RELEASE.txt"
          {
            (cd "$OUT" && sha256sum atm-jq-pilot-experimental.exe)
            echo "commit ${{ github.sha }}"
            echo "target ${{ matrix.target }}"
            echo "cargo features: jq-pilot (non-default); profile: debug; unsigned; no bundle"
            rustc -V
          } > "$OUT/SHA256.txt"
          cat "$OUT/SHA256.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.name == 'windows-x64' && github.event_name == 'push' && github.ref == 'refs/heads/development'
        with:
          name: jq-pilot-experimental-unsigned-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/jq-pilot-unsigned/
          retention-days: 3
          if-no-files-found: error
