name: CI

# Evidence policy: a green job here proves what its steps actually did on that runner and nothing more.
# In particular, macOS compiling and running the headless --self-check is NOT a macOS GUI test.
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ai-toolchain-manager.exe
          - name: macos-arm64
            os: macos-14 # Apple Silicon (arm64) runner
            target: aarch64-apple-darwin
            exe: ai-toolchain-manager
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Rust toolchain (stable, ${{ matrix.target }})
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
          rustup default stable
          rustc -vV
          cargo -V

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ matrix.name }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.name }}-

      - name: Confirm runner architecture
        run: |
          echo "runner: $RUNNER_OS / $RUNNER_ARCH"
          if [ "${{ matrix.name }}" = "macos-arm64" ]; then test "$(uname -m)" = "arm64"; fi

      - name: Phase 0 contract tests (Python)
        run: |
          python -m pip install -r requirements-test.txt
          python -m unittest discover -s tests -v

      - name: Frontend install, typecheck, test, build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Rust format, lint and unit tests
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings
          cargo test --target ${{ matrix.target }}

      # Phase 3D-2: the SYNTHETIC pilot supply (made-up tools and bytes, acting adapter constructor) is compiled only with this non-default
      # feature. This step lints and tests that configuration; the release build below never enables it.
      - name: Synthetic-pilot feature configuration (lint and tests; never part of the release build)
        working-directory: src-tauri
        run: |
          cargo clippy --target ${{ matrix.target }} --all-targets --features synthetic-pilot -- -D warnings
          cargo test --target ${{ matrix.target }} --features synthetic-pilot

      # Phase 3D-4 (B2): the jq pilot configuration. The feature is Windows-only (a compile error elsewhere), off by default and never part of the
      # release build below. Even where it compiles, the real jq bytes stay locked; the tests use synthetic bytes only. CI-generated, SUPPORTING evidence.
      - name: jq-pilot feature configuration (Windows only; lint and tests; never part of the release build)
        if: matrix.name == 'windows-x64'
        working-directory: src-tauri
        run: |
          cargo clippy --target ${{ matrix.target }} --all-targets --features jq-pilot -- -D warnings
          cargo test --target ${{ matrix.target }} --features jq-pilot

      - name: jq-pilot feature is refused on macOS at compile time (the default build there stays unable to install jq)
        if: matrix.name == 'macos-arm64'
        working-directory: src-tauri
        run: |
          if cargo check --target ${{ matrix.target }} --features jq-pilot > "${{ runner.temp }}/jq-pilot-macos.txt" 2>&1; then
            echo "the jq-pilot feature compiled on macOS: it must not"; exit 1
          fi
          grep -q "Windows-only" "${{ runner.temp }}/jq-pilot-macos.txt"
          echo "refused as intended:"; grep -m1 "Windows-only" "${{ runner.temp }}/jq-pilot-macos.txt"

      - name: B2 staging reproduction (synthetic bytes; supporting evidence)
        run: python tools/run_staging.py --manifest docs/phase-3d4/b2-staging-manifest.json --skip-frontend --report "${{ runner.temp }}/b2-staging-report-${{ matrix.name }}.json"

      # Phase 3D-3B: runs EXACTLY the identifiers of docs/phase-3d3b/staging-manifest.json on the synthetic fixture. CI-generated, SUPPORTING evidence of
      # this commit only (exit status 0 = every named check passed); the developer-authored assertions do not become independent by running here.
      - name: Staging reproduction of the jq review package (synthetic fixture; supporting evidence)
        run: python tools/run_staging.py --skip-frontend --report "${{ runner.temp }}/staging-report-${{ matrix.name }}.json"

      - name: Build Tauri app (no bundle, no signing)
        run: npx tauri build --no-bundle --target ${{ matrix.target }}

      - name: Verify the built binary's architecture
        run: |
          BIN="src-tauri/target/${{ matrix.target }}/release/${{ matrix.exe }}"
          ls -l "$BIN"
          if [ "${{ matrix.name }}" = "macos-arm64" ]; then file "$BIN" | tee /dev/stderr | grep -q arm64; fi

      - name: Headless self-check of the built binary + cross-language audit contract
        env:
          ATM_DATA_DIR: ${{ runner.temp }}/atm-selfcheck-data
        run: |
          BIN="src-tauri/target/${{ matrix.target }}/release/${{ matrix.exe }}"
          OUT="${{ runner.temp }}/selfcheck-${{ matrix.name }}.json"
          "$BIN" --self-check "$OUT"
          head -c 1500 "$OUT"; echo   # no pipe: with pipefail, `cat | head` fails (SIGPIPE) once the file exceeds the pipe buffer
          ATM_SELFCHECK_JSON="$OUT" python -m unittest discover -s tests -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfcheck-${{ matrix.name }}
          path: ${{ runner.temp }}/selfcheck-${{ matrix.name }}.json
          if-no-files-found: warn

      # For real-device acceptance only (docs/phase-3d0/DEVICE-TEST-PLAN.md): the UNSIGNED, un-notarised binary of this exact SHA,
      # kept for 3 days, with its SHA-256. It is run only with --self-check and an isolated ATM_DATA_DIR. It is not a release.
      - name: Record the SHA-256 of the unsigned device-test binary
        run: |
          BIN="src-tauri/target/${{ matrix.target }}/release/${{ matrix.exe }}"
          mkdir -p "${{ runner.temp }}/device-test"
          cp "$BIN" "${{ runner.temp }}/device-test/${{ matrix.exe }}"
          (cd "${{ runner.temp }}/device-test" && (sha256sum "${{ matrix.exe }}" 2>/dev/null || shasum -a 256 "${{ matrix.exe }}") > SHA256.txt && echo "commit ${{ github.sha }}" >> SHA256.txt && cat SHA256.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: device-test-unsigned-${{ matrix.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/device-test/
          retention-days: 3
          if-no-files-found: error
