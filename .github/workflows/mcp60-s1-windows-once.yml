# S2-C0 R1: one source-and-workflow push from exact R6 head (76c6a587). No artifact, no secrets, no repeat attempts.
# Ephemeral branch-only CI; this is NOT the permanent .github/workflows/ci.yml MCP step.
name: ATM MCP60 S1 one-time Windows verification

on:
  push:
    branches:
      - review/mcp60-s1-windows-v3

permissions:
  contents: read

concurrency:
  group: mcp60-s1-windows-v3
  cancel-in-progress: false

jobs:
  isolated-s1:
    # One C0 push, based on exact R6 CI head. A re-run of the run is refused by run_attempt == 1. No later push can trigger.
    if: github.event.created == false && github.event.before == '76c6a58735d090a0abbc043986447b3002e1e630' && github.ref == 'refs/heads/review/mcp60-s1-windows-v3' && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout immutable triggering SHA (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pin already in ATM ci.yml
        with:
          persist-credentials: false
          fetch-depth: 9

      - name: Fail-closed provenance, target, and lockfile preflight
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "GITHUB_SHA=$env:GITHUB_SHA"
          Write-Output "GITHUB_REF=$env:GITHUB_REF"
          Write-Output "RUNNER_OS=$env:RUNNER_OS; RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Output "IMAGE_OS=$env:ImageOS; IMAGE_VERSION=$env:ImageVersion"
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'HEAD != GITHUB_SHA' }
          $revLine = (git rev-list --parents -n 1 HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the commit parents' }
          $revParts = @($revLine -split ' ')
          if ($revParts.Count -ne 2) { throw "HEAD must have exactly one parent, found $($revParts.Count - 1)" }
          if ($revParts[0] -cne $head) { throw 'rev-list does not describe HEAD' }
          if ($revParts[1] -cne '76c6a58735d090a0abbc043986447b3002e1e630') { throw 'The parent is not the R6 head' }
          $chain = @(
            '76c6a58735d090a0abbc043986447b3002e1e630',
            '2e805781b87fe32bfd4e89f33727d42780ffac36',
            '134c23e542f2b93a158d4c69b572ffac70998ba8',
            'f6b19255579d81a646c6f6c5cab1b3e60b1da620',
            '41d2dc24ac00643a89b870a9d91c6bd04efec2ca',
            'df740bf1cc16d2f0a816c515bc5de615f9069cc8',
            '0fa04d8d30b2ce416ff5909f6d27af738c49326e'
          )
          for ($i = 0; $i -lt $chain.Count; $i++) {
            $n = $i + 1
            $ancestor = (git rev-parse "HEAD~$n").Trim()
            if ($LASTEXITCODE -ne 0 -or $ancestor -cne $chain[$i]) { throw "Unexpected ancestor HEAD~$n" }
          }
          $tab = [string][char]9
          $nameStatus = @(git diff --no-renames --name-status HEAD^ HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the one-push diff' }
          $expectedStatus = @(
            ('M' + $tab + '.github/workflows/mcp60-s1-windows-once.yml'),
            ('M' + $tab + 'atm-mcp/src/lib.rs'),
            ('A' + $tab + 'atm-mcp/src/snapshot.rs'),
            ('A' + $tab + 'atm-mcp/tests/snapshot.rs')
          )
          if ($nameStatus.Count -ne $expectedStatus.Count) { throw 'C0 one-push diff must contain exactly four entries' }
          foreach ($line in $expectedStatus) {
            if ($nameStatus -cnotcontains $line) { throw "C0 one-push diff is missing: $line" }
          }
          if ($env:RUNNER_ARCH -cne 'X64') { throw 'Expected Windows x64' }
          $paths = @(git diff --no-renames --name-only '0fa04d8d30b2ce416ff5909f6d27af738c49326e' HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect exact source diff' }
          $allowedWorkflow = '.github/workflows/mcp60-s1-windows-once.yml'
          foreach ($path in $paths) {
            if (!($path -clike 'atm-mcp/*' -or $path -ceq $allowedWorkflow)) {
              throw "Out-of-scope path in review commit: $path"
            }
          }
          if ($paths -cnotcontains $allowedWorkflow) { throw 'Missing the one-time workflow in the review commit' }
          $pins = [ordered]@{
            'atm-mcp/src/guard.rs'      = '189fdc539d42725ac4661700e2849906e8e20cee200929d52254994c23231238'
            'atm-mcp/src/main.rs'       = '736757e3d1ed2169ef125f4ff95d20f0e0c0d5d63190192df2a55e1bf26ce857'
            'atm-mcp/src/tools.rs'      = 'a5dc3fb9fd680bb50b81e2f460b8d0cc2f4d5ee6a273f45b1105da49658e1f94'
            'atm-mcp/src/server.rs'     = 'fbf63404a9acaffb6ca9f516b70b24ce8c3e158469cb58eab811faecee2572f2'
            'atm-mcp/src/catalog.rs'    = 'a00dcd752bd57fdbb4a50a591d19c50c17f2d13c750228105a0b0fdf94dbc27f'
            'atm-mcp/Cargo.toml'        = '9140b434a9739a797707539855ff3450932a6d7ca1e3e5a21adb1495c9d2f24f'
            'atm-mcp/src/lib.rs'        = '275263eb3820e2cc38f8533a37f31d71ed54539f9ab08ccf047b5f1b4277636d'
            'atm-mcp/src/snapshot.rs'   = '2c48ac9f8c9f7d28b0a48856ec84307566fca58912b4efaedcdb972fc14e4697'
            'atm-mcp/tests/snapshot.rs' = '85d85f97ba001827af07a110a83a5415b11ff7e2204fc26378e9471381e8df38'
          }
          foreach ($entry in $pins.GetEnumerator()) {
            $got = (Get-FileHash $entry.Key -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($got -cne $entry.Value) { throw "Unexpected source $($entry.Key): $got" }
          }
          $expected = 'cb0ab0844775b6ef33a87edc52101d83b1f735bed8ea1dbd061f91e905607ab1'
          $actual = (Get-FileHash 'atm-mcp/Cargo.lock' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw "Cargo.lock changed: $actual" }
          Write-Output "CARGO_LOCK_SHA256=$actual"
          @'
          import re, tomllib
          from pathlib import Path
          lock = tomllib.loads(Path('atm-mcp/Cargo.lock').read_text(encoding='utf-8'))
          pkgs = lock['package']
          registry = [p for p in pkgs if 'source' in p]
          local = [p for p in pkgs if 'source' not in p]
          assert len(registry) == 87 and len(local) == 1, f'unexpected Cargo.lock inventory {len(registry)}/{len(local)}'
          for p in registry:
              assert p['source'] == 'registry+https://github.com/rust-lang/crates.io-index', p['name']
              assert re.fullmatch(r'[0-9a-f]{64}',p.get('checksum', '')), p['name']
          print(f'LOCK_PROVENANCE_OK registry={len(registry)} local={len(local)}')
          manifest = tomllib.loads(Path('atm-mcp/Cargo.toml').read_text(encoding='utf-8'))
          deps = manifest['dependencies']
          rmcp = deps['rmcp']
          assert rmcp['version'] == '=3.9.0' and rmcp['default-features'] is False
          assert set(rmcp['features']) == {'server', 'transport-io'}
          for name, spec in deps.items():
              if isinstance(spec, dict):
                  assert not any(k in spec for k in ('git', 'path', 'registry')), name
          assert 'workspace' in manifest and not manifest['workspace'], 'MCP package is no longer standalone'
          print('MCP_MANIFEST_SCOPE_OK rmcp=3.9.0 no-default-features server+transport-io')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock provenance check failed' }
          $rustcInfo = @(rustc -vV)
          if ($LASTEXITCODE -ne 0) { throw 'Rust compiler is missing' }
          $rustcInfo | ForEach-Object { Write-Output $_ }
          $hostLines = @($rustcInfo | Where-Object { $_ -clike 'host: *' })
          if ($hostLines.Count -ne 1 -or $hostLines[0] -cne 'host: x86_64-pc-windows-msvc') { throw "Unexpected Rust host: $($hostLines -join ';')" }
          cargo -V
          if ($LASTEXITCODE -ne 0) { throw 'Cargo missing' }
          cargo fmt --version
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt not installed; do not install it in CI' }
          cargo clippy --version
          if ($LASTEXITCODE -ne 0) { throw 'Clippy not installed; do not install it in CI' }

      - name: One crates.io-only dependency fetch for exact Windows target
        working-directory: atm-mcp
        env:
          CARGO_HOME: ${{ runner.temp }}\mcp60-cargo-home
        run: |
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Authorized fetch failed; stop' }

      # First S1 compilation must not be blocked by style-only rustfmt differences.
      # The priority is compile -> actual tests -> lint; no source is autoformatted or modified.
      - name: Offline dependency features, build, functional tests, and strict Clippy
        working-directory: atm-mcp
        env:
          CARGO_HOME: ${{ runner.temp }}\mcp60-cargo-home
        run: |
          cargo tree --offline --locked --target x86_64-pc-windows-msvc -e features
          if ($LASTEXITCODE -ne 0) { throw 'Cargo feature inventory failed' }
          cargo build --offline --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust build failed' }
          cargo test --offline --locked --target x86_64-pc-windows-msvc --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'S1 test suite failed' }
          cargo clippy --offline --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          Write-Output 'S1_CI_SUPPORTING_TESTS_PASSED_NOT_INDEPENDENT_SECURITY_ACCEPTANCE'
