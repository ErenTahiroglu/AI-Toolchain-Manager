# R6: one artifact-only push from exact R5 green head; no source modifications, no repeat attempts.
# Ephemeral branch-only CI; this is NOT the permanent .github/workflows/ci.yml MCP step.
name: ATM MCP60 S1 one-time Windows verification

on:
  push:
    branches:
      - review/mcp60-s1-windows-v3

permissions:
  contents: read

concurrency:
  group: mcp60-s1-windows-v3
  cancel-in-progress: false

jobs:
  isolated-s1:
    # One artifact-only sixth push, based on exact R5 green CI SHA. No later push can trigger.
    if: github.event.created == false && github.event.before == '2e805781b87fe32bfd4e89f33727d42780ffac36' && github.ref == 'refs/heads/review/mcp60-s1-windows-v3'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout immutable triggering SHA (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pin already in ATM ci.yml
        with:
          persist-credentials: false
          fetch-depth: 7

      - name: Fail-closed provenance, target, and lockfile preflight
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "GITHUB_SHA=$env:GITHUB_SHA"
          Write-Output "GITHUB_REF=$env:GITHUB_REF"
          Write-Output "RUNNER_OS=$env:RUNNER_OS; RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Output "IMAGE_OS=$env:ImageOS; IMAGE_VERSION=$env:ImageVersion"
          $head = (git rev-parse HEAD).Trim()
          $parent = (git rev-parse HEAD^).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'HEAD != GITHUB_SHA' }
          if ($parent -ne '2e805781b87fe32bfd4e89f33727d42780ffac36') { throw 'Unexpected R5 green parent commit' }
          $grandparent = (git rev-parse HEAD^^).Trim()
          if ($LASTEXITCODE -ne 0 -or $grandparent -ne '134c23e542f2b93a158d4c69b572ffac70998ba8') { throw 'Unexpected R4 grandparent' }
          $greatgrandparent = (git rev-parse HEAD^^^).Trim()
          if ($LASTEXITCODE -ne 0 -or $greatgrandparent -ne 'f6b19255579d81a646c6f6c5cab1b3e60b1da620') { throw 'Unexpected R3 great-grandparent' }
          $fourthAncestor = (git rev-parse HEAD^^^^).Trim()
          if ($LASTEXITCODE -ne 0 -or $fourthAncestor -ne '41d2dc24ac00643a89b870a9d91c6bd04efec2ca') { throw 'Unexpected R2 fourth ancestor' }
          $fifthAncestor = (git rev-parse HEAD^^^^^).Trim()
          if ($LASTEXITCODE -ne 0 -or $fifthAncestor -ne 'df740bf1cc16d2f0a816c515bc5de615f9069cc8') { throw 'Unexpected R1 fifth ancestor' }
          $baseline = (git rev-parse HEAD^^^^^^).Trim()
          if ($LASTEXITCODE -ne 0 -or $baseline -ne '0fa04d8d30b2ce416ff5909f6d27af738c49326e') { throw 'Unexpected baseline sixth ancestor' }
          $singlePushPaths = @(git diff --name-only HEAD^ HEAD)
          if ($LASTEXITCODE -ne 0 -or $singlePushPaths.Count -ne 1 -or
              $singlePushPaths[0] -ne '.github/workflows/mcp60-s1-windows-once.yml') {
            throw 'R6 one-push diff must contain exactly the temporary workflow; atm-mcp tree must be unchanged'
          }
          if ($env:RUNNER_ARCH -ne 'X64') { throw 'Expected Windows x64' }
          $paths = @(git diff --name-only '0fa04d8d30b2ce416ff5909f6d27af738c49326e' HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect exact source diff' }
          $allowedWorkflow = '.github/workflows/mcp60-s1-windows-once.yml'
          foreach ($path in $paths) {
            if (!($path -like 'atm-mcp/*' -or $path -eq $allowedWorkflow)) {
              throw "Out-of-scope path in review commit: $path"
            }
          }
          if ($paths -notcontains $allowedWorkflow) { throw 'Missing the one-time workflow in the review commit' }
          $guardExpected = '189fdc539d42725ac4661700e2849906e8e20cee200929d52254994c23231238'
          $guardActual = (Get-FileHash 'atm-mcp/src/guard.rs' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($guardActual -ne $guardExpected) { throw "Unexpected R3 guard.rs source: $guardActual" }
          $mainExpected = '736757e3d1ed2169ef125f4ff95d20f0e0c0d5d63190192df2a55e1bf26ce857'
          $mainActual = (Get-FileHash 'atm-mcp/src/main.rs' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($mainActual -ne $mainExpected) { throw "Unexpected R4 main.rs source: $mainActual" }
          $toolsExpected = 'a5dc3fb9fd680bb50b81e2f460b8d0cc2f4d5ee6a273f45b1105da49658e1f94'
          $toolsActual = (Get-FileHash 'atm-mcp/src/tools.rs' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($toolsActual -ne $toolsExpected) { throw "Unexpected R5 tools.rs source: $toolsActual" }
          $expected = 'cb0ab0844775b6ef33a87edc52101d83b1f735bed8ea1dbd061f91e905607ab1'
          $actual = (Get-FileHash 'atm-mcp/Cargo.lock' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Cargo.lock changed: $actual" }
          Write-Output "CARGO_LOCK_SHA256=$actual"
          @'
          import re, tomllib
          from pathlib import Path
          lock = tomllib.loads(Path('atm-mcp/Cargo.lock').read_text(encoding='utf-8'))
          pkgs = lock['package']
          registry = [p for p in pkgs if 'source' in p]
          local = [p for p in pkgs if 'source' not in p]
          assert len(registry) == 87 and len(local) == 1, f'unexpected Cargo.lock inventory {len(registry)}/{len(local)}'
          for p in registry:
              assert p['source'] == 'registry+https://github.com/rust-lang/crates.io-index', p['name']
              assert re.fullmatch(r'[0-9a-f]{64}',p.get('checksum', '')), p['name']
          print(f'LOCK_PROVENANCE_OK registry={len(registry)} local={len(local)}')
          manifest = tomllib.loads(Path('atm-mcp/Cargo.toml').read_text(encoding='utf-8'))
          deps = manifest['dependencies']
          rmcp = deps['rmcp']
          assert rmcp['version'] == '=3.9.0' and rmcp['default-features'] is False
          assert set(rmcp['features']) == {'server', 'transport-io'}
          for name, spec in deps.items():
              if isinstance(spec, dict):
                  assert not any(k in spec for k in ('git', 'path', 'registry')), name
          assert 'workspace' in manifest and not manifest['workspace'], 'MCP package is no longer standalone'
          print('MCP_MANIFEST_SCOPE_OK rmcp=3.9.0 no-default-features server+transport-io')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock provenance check failed' }
          rustc -vV
          if ($LASTEXITCODE -ne 0) { throw 'Rust compiler is missing' }
          $target = (rustc -vV | Select-String '^host:').ToString()
          if ($target -notmatch 'x86_64-pc-windows-msvc') { throw "Unexpected Rust host $target" }
          cargo -V
          if ($LASTEXITCODE -ne 0) { throw 'Cargo missing' }
          cargo fmt --version
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt not installed; do not install it in CI' }
          cargo clippy --version
          if ($LASTEXITCODE -ne 0) { throw 'Clippy not installed; do not install it in CI' }

      - name: One crates.io-only dependency fetch for exact Windows target
        working-directory: atm-mcp
        env:
          CARGO_HOME: ${{ runner.temp }}\mcp60-cargo-home
        run: |
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Authorized fetch failed; stop' }

      # First S1 compilation must not be blocked by style-only rustfmt differences.
      # The priority is compile -> actual tests -> lint; no source is autoformatted or modified.
      - name: Offline dependency features, build, functional tests, and strict Clippy
        working-directory: atm-mcp
        env:
          CARGO_HOME: ${{ runner.temp }}\mcp60-cargo-home
        run: |
          cargo tree --offline --locked --target x86_64-pc-windows-msvc -e features
          if ($LASTEXITCODE -ne 0) { throw 'Cargo feature inventory failed' }
          cargo build --offline --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust build failed' }
          cargo test --offline --locked --target x86_64-pc-windows-msvc --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'S1 test suite failed' }
          cargo clippy --offline --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          Write-Output 'S1_CI_SUPPORTING_TESTS_PASSED_NOT_INDEPENDENT_SECURITY_ACCEPTANCE'
      # Export only the exact Windows binary just built and exercised by the passing test suite.
      # Artifact is deliberately short-lived and publicly downloadable while retained.
      - name: Hash exactly the tested Windows executable
        working-directory: atm-mcp
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'target\x86_64-pc-windows-msvc\debug\atm-mcp.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Expected MCP executable missing; no upload' }
          $file = Get-Item -LiteralPath $exe
          if ($file.Length -le 0) { throw 'MCP executable empty; no upload' }
          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -notmatch '^[a-f0-9]{64}$') { throw 'Invalid SHA-256 format; no upload' }
          $shaFile = Join-Path $file.DirectoryName 'atm-mcp.exe.sha256'
          [System.IO.File]::WriteAllText($shaFile, "$sha  atm-mcp.exe`n", [System.Text.UTF8Encoding]::new($false))
          $line = [System.IO.File]::ReadAllText($shaFile).Trim()
          if ($line -ne "$sha  atm-mcp.exe") { throw 'SHA sidecar mismatch; no upload' }
          Write-Output "ATM_MCP_EXE_SHA256=$sha"
          Write-Output "ATM_MCP_EXE_BYTES=$($file.Length)"
          Write-Output "ATM_MCP_SOURCE_COMMIT=$env:GITHUB_SHA"

      - name: Publish 1-day artifact (only exe and its SHA-256 sidecar)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 pinned from official actions/upload-artifact tag
        with:
          name: atm-mcp60-s1-windows-x64-exact-r6
          path: |
            atm-mcp/target/x86_64-pc-windows-msvc/debug/atm-mcp.exe
            atm-mcp/target/x86_64-pc-windows-msvc/debug/atm-mcp.exe.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
