[package]
name = "ai-toolchain-manager"
version = "0.1.0"
description = "AI Toolchain Manager - Phase 1A desktop foundation"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "ai_toolchain_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"

# Handle-based, no-follow file access for the read-only discovery layer (discovery/fsx.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx"] }
# Windows Hello (KeyCredentialManager). Phase 3D-1: only the READ-ONLY availability probe is reachable; key creation / signing are compiled
# but gated behind an explicit-enable record and are not called from any command.
windows = { version = "0.62", features = ["Foundation", "Security_Credentials", "Security_Credentials_UI", "Security_Cryptography", "Security_Cryptography_Core", "Storage_Streams"] }
# raw-dylib import of the one WinRT apartment function (no import library needed)
windows-link = "0.2"

[features]
# Phase 3D-2: compiles the SYNTHETIC pilot supply (made-up tools, recipes, references and bytes) and the acting adapter constructor into a
# NON-release build, so the real application workflow can be exercised end to end in an isolated data directory. It is off by default,
# CI's release build does not enable it, and no installation of a real tool can pass the adapter's synthetic-only gate in either case.
synthetic-pilot = []
# Phase 3D-4 (B2): compiles the supply of the ONE reviewed jq 1.8.2 / Windows x64 pilot (module `jq_pilot`): its reviewed recipe, authenticated reference,
# source attestation, local-use licence record, notices, catalog row and the fixed read-only retained-file provider. Off by default, Windows-only
# (a compile error elsewhere), never combined with `synthetic-pilot`, and never enabled by CI's release build. Even where it is compiled, the real
# jq bytes stay LOCKED (`jq_pilot::B3_UNLOCK` is `None`) until a separate, reviewed B3 change; synthetic bytes exercise the whole path in tests.
jq-pilot = []

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The SHA-256 fingerprint of large program files must not take tens of seconds in debug builds (it would hit the
# per-file deadline); optimise only this crate in the dev profile.
[profile.dev.package.sha2]
opt-level = 3
